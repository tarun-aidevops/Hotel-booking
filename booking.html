```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Your Stay - StayNest</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        Stay<span>Nest</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
    </nav>

</header>


<section class="booking-page">

    <div class="booking-card">

        <p class="eyebrow">
            RESERVE YOUR ROOM
        </p>

        <h1>
            Complete Your Booking
        </h1>

        <p class="muted">
            Enter your details to reserve your room.
        </p>


        <form id="bookingForm">


            <div class="form-row">

                <div>
                    <label>First Name</label>

                    <input
                        type="text"
                        id="firstName"
                        required
                    >
                </div>


                <div>

                    <label>Last Name</label>

                    <input
                        type="text"
                        id="lastName"
                        required
                    >

                </div>

            </div>


            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >


            <label>Phone</label>

            <input
                type="tel"
                id="phone"
                required
            >


            <div class="form-row">

                <div>

                    <label>Check-in</label>

                    <input
                        type="date"
                        id="bookingCheckIn"
                        required
                    >

                </div>


                <div>

                    <label>Check-out</label>

                    <input
                        type="date"
                        id="bookingCheckOut"
                        required
                    >

                </div>

            </div>


            <label>
                Special Requests
            </label>

            <textarea
                id="requests"
                rows="4"
                placeholder="Airport pickup, late check-in, etc."
            ></textarea>


            <div class="booking-summary">

                <div>

                    <span>Room</span>

                    <strong id="selectedRoom">
                        Deluxe King Room
                    </strong>

                </div>


                <div>

                    <span>Price</span>

                    <strong id="selectedPrice">
                        ₹4,999 / night
                    </strong>

                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Confirm Booking
            </button>


        </form>

    </div>

</section>


<script src="js/app.js"></script>

</body>
</html>
```
